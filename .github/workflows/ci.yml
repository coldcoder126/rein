name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi
      # The repository holds several modules (see docs/architecture.md); every step runs in each of them.
      - name: go mod tidy
        run: scripts/modules.sh go mod tidy && git diff --exit-code
      - name: go vet
        run: scripts/modules.sh go vet ./...
      - name: go test
        # Real model integration tests skip themselves unless REIN_INTEGRATION=1.
        run: scripts/modules.sh go test -race ./...
      - name: build for Windows
        run: GOOS=windows scripts/modules.sh go build ./...

  vulncheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: scripts/modules.sh govulncheck ./...
